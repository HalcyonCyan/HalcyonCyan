<svg
  width="1200"
  height="440"
  viewBox="0 0 1200 440"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect
    x="1"
    y="1"
    width="1198"
    height="438"
    rx="18"
    fill="url(#bg)"
    stroke="#334155"
    stroke-width="2"
  />

  <g
    fill="#FFFFFF"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-style="italic"
  >

    <text x="600" y="82" font-size="26">
      “Learn from first principles.
    </text>

    <text x="600" y="142" font-size="26">
      Understand the abstraction.
    </text>

    <text x="600" y="202" font-size="26">
      Then look underneath it.
    </text>

    <text
      x="600"
      y="300"
      font-size="82"
      font-style="normal"
      font-family="Georgia, serif"
    >
      ∞
    </text>

    <text x="600" y="380" font-size="26">
      So I want to study math forever.”
    </text>

  </g>
</svg>
